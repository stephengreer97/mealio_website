name: Tests

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-tests:
    name: API route tests (Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # The SQL parser for tests/lib/sql-parses.test.ts. pglast wraps
      # libpg_query -- the real Postgres grammar -- so the migrations are
      # checked against the actual parser rather than by reading them. It is
      # deliberately NOT an npm dependency: nothing in the app imports it, and
      # it is the only Python in the repo. Without this step the test suite goes
      # red rather than quietly skipping, which is the point.
      - name: Install the Postgres SQL parser
        run: pip install --disable-pip-version-check pglast

      - run: npm test
